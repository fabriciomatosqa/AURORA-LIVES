name: AURORA LIVES Android — APK experimental

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-arm64:
    name: Android ARM64 · build e APK de teste
    runs-on: ubuntu-latest
    timeout-minutes: 110
    defaults:
      run:
        working-directory: apps/desktop
    env:
      CI: 'true'
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Instalar Android SDK e NDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "Android SDK Command-line Tools não estão instalados no runner." >&2
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-36' 'platforms;android-35' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'platform-tools'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Instalar dependências React, PeerJS e Tauri
        run: npm install --no-audit --no-fund
      - name: Verificar código compartilhado e testes
        run: |
          npm run test
          npm run build
      - name: Gerar identidade visual AURORA
        run: npm run icons
      - name: Inicializar projeto Android Tauri 2
        run: npm run tauri -- android init --ci --skip-targets-install
      - name: Permitir microfone e orientação retrato/paisagem
        run: python3 scripts/patch-android-manifest.py
      - name: Compilar APK Android ARM64 experimental
        run: npm run tauri -- android build --apk --debug --target aarch64 --ci
      - name: Verificar e identificar APK para teste
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-android
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" dist-android/AURORA-LIVES-Android-arm64-DEBUG.apk
          test "$(stat -c %s dist-android/AURORA-LIVES-Android-arm64-DEBUG.apk)" -gt 1000000
          (cd dist-android && sha256sum *.apk > SHA256SUMS-ANDROID.txt && sha256sum -c SHA256SUMS-ANDROID.txt)
          echo 'APK DE DEBUG: certificado temporário; pode exigir reinstalação em versões futuras.' >> "$GITHUB_STEP_SUMMARY"
      - name: Disponibilizar APK de teste no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: AURORA-LIVES-Android-ARM64-DEBUG-PREVIEW
          path: |
            apps/desktop/dist-android/*.apk
            apps/desktop/dist-android/SHA256SUMS-ANDROID.txt
          retention-days: 30
          if-no-files-found: error

  android-preview-asset:
    name: Anexar APK de teste à release GitHub
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AURORA-LIVES-Android-ARM64-DEBUG-PREVIEW
          path: android-preview
      - name: Validar APK e aguardar publicação dos instaladores desktop
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd android-preview && sha256sum -c SHA256SUMS-ANDROID.txt)
          TAG="v$(node -p "require('./apps/desktop/package.json').version")-preview"
          echo "Anexando APK DEBUG experimental à release $TAG."
          ready=0
          for attempt in $(seq 1 90); do
            if gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx 'false'; then
              ready=1
              break
            fi
            sleep 20
          done
          if [[ "$ready" != 1 ]]; then
            echo "Release de Windows/Linux não foi publicada; APK permanece acessível nos artefatos da Action." >&2
            exit 1
          fi
          gh release upload "$TAG" \
            android-preview/AURORA-LIVES-Android-arm64-DEBUG.apk \
            android-preview/SHA256SUMS-ANDROID.txt
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx 'AURORA-LIVES-Android-arm64-DEBUG.apk'
          echo "APK DEBUG disponibilizado no mesmo GitHub Release; não possui assinatura persistente." >> "$GITHUB_STEP_SUMMARY"
