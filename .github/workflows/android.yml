name: AURORA LIVES Android — APK experimental e assinado

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never race first-time key creation or cache save for the same branch.
concurrency:
  group: aurora-lives-android-signing-${{ github.ref }}
  # PRs never restore the signing key; superseded PR builds may be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  updater-integration:
    uses: ./.github/workflows/android-updater-tests.yml

  android-arm64:
    name: Android ARM64 · release assinado ou prévia debug
    runs-on: ubuntu-latest
    timeout-minutes: 110
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    defaults:
      run:
        working-directory: apps/desktop
    env:
      CI: 'true'
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Testar validador de assinatura, metadados e instalador Android
        run: |
          python3 -m unittest discover -s scripts -p 'test_*android*.py'
          python3 -m unittest discover -s scripts -p 'test_android_installer_intent.py'

      - name: Instalar Android SDK e NDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "Android SDK Command-line Tools não estão instalados no runner." >&2
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-36' 'platforms;android-35' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'platform-tools'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Instalar dependências React, PeerJS e Tauri
        run: npm install --no-audit --no-fund
      - name: Verificar código compartilhado e testes
        run: |
          npm run test
          npm run build
      - name: Gerar identidade visual AURORA
        run: npm run icons
      - name: Inicializar projeto Android Tauri 2
        run: npm run tauri -- android init --ci --skip-targets-install
      - name: Permissões Android, FileProvider e instalador nativo
        run: python3 scripts/patch-android-manifest.py
      - name: Normalizar tecnicamente os PNGs do ícone Android sem alterar o desenho
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 scripts/normalize-android-icons.py
      - name: Forçar os ícones do APK a usar a logo oficial AURORA
        run: |
          python3 -m unittest discover -s scripts -p 'test_launcher_icons.py'
          python3 scripts/sync-android-launcher.py
      # Same signing-key lifecycle as AURORA IPTV: restore from Actions cache,
      # recover from repository Secrets, or bootstrap ONLY the first release.
      # PR builds cannot access the key and remain disposable DEBUG builds.
      - name: Recuperar assinatura de teste persistente
        id: signing-cache
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/cache/restore@v4
        with:
          path: apps/desktop/.signing
          key: aurora-lives-android-test-signing-v1

      - name: Configurar assinatura de teste Android
        id: signing
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 scripts/ci-android-signing.py
          python3 scripts/configure-android-signing.py
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo 'Assinatura de teste Android persistente configurada.' >> "$GITHUB_STEP_SUMMARY"
      - name: Compilar APK Android ARM64 assinado
        if: steps.signing.outputs.signed == 'true'
        run: npx --no-install tauri android build --apk --target aarch64 --ci
      - name: Compilar APK ARM64 DEBUG experimental
        if: steps.signing.outputs.signed != 'true'
        run: npx --no-install tauri android build --apk --debug --target aarch64 --ci
      - name: Verificar APK e identificar assinatura
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-android
          if [[ "${{ steps.signing.outputs.signed }}" == "true" ]]; then
            apk="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' ! -name '*debug*' ! -name '*unsigned*' -print -quit)"
            dest=AURORA-LIVES-Android-arm64.apk
          else
            apk="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*debug*.apk' -print -quit)"
            dest=AURORA-LIVES-Android-arm64-DEBUG.apk
          fi
          test -n "$apk"
          cp "$apk" "dist-android/$dest"
          test "$(stat -c %s "dist-android/$dest")" -gt 1000000
          (cd dist-android && sha256sum *.apk > SHA256SUMS-ANDROID.txt && sha256sum -c SHA256SUMS-ANDROID.txt)
          APK_SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$APK_SIGNER"
          "$APK_SIGNER" verify --print-certs --verbose "dist-android/$dest" > "$RUNNER_TEMP/aurora-apk-cert.txt"
          cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/aurora-apk-cert.txt" | head -n 1)"
          test "${#cert}" -eq 64
          printf '%s\n' "$cert" > dist-android/ANDROID-CERT-SHA256.txt
          python3 scripts/verify-android-release.py "dist-android/$dest" "dist-android/ANDROID-CERT-SHA256.txt"
          echo "APK: $dest" >> "$GITHUB_STEP_SUMMARY"
          echo "Assinatura SHA-256: $cert" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$dest" == *DEBUG* ]]; then
            echo 'Somente teste! Não publique este APK como atualização oficial.' >> "$GITHUB_STEP_SUMMARY"
          fi
      # Save the private TEST key to repository-scoped Actions cache.
      # If evicted, only the identical key from Secrets can restore releases.
      - name: Salvar chave de teste entre compilações
        if: steps.signing.outputs.signed == 'true' && steps.signing-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: apps/desktop/.signing
          key: aurora-lives-android-test-signing-v1

      - name: Disponibilizar APK de teste no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: AURORA-LIVES-Android-ARM64-PREVIEW
          path: |
            apps/desktop/dist-android/*.apk
            apps/desktop/dist-android/SHA256SUMS-ANDROID.txt
            apps/desktop/dist-android/ANDROID-CERT-SHA256.txt
            apps/desktop/dist-android/aurora-lives-update.json
            apps/desktop/dist-android/ANDROID-MANIFEST-TREE.txt
          retention-days: 30
          if-no-files-found: error

  android-preview-asset:
    name: Anexar APK Android à release GitHub
    # Never publish a transient DEBUG certificate as an in-place app update.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.android-arm64.outputs.signed == 'true'
    needs: [android-arm64, updater-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AURORA-LIVES-Android-ARM64-PREVIEW
          path: android-preview
      - name: Validar APK e aguardar publicação dos instaladores desktop
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd android-preview && sha256sum -c SHA256SUMS-ANDROID.txt)
          TAG="v$(node -p "require('./apps/desktop/package.json').version")-preview"
          echo "Anexando APK Android à release $TAG."
          ready=0
          for attempt in $(seq 1 90); do
            if gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx 'false'; then
              ready=1
              break
            fi
            sleep 20
          done
          if [[ "$ready" != 1 ]]; then
            echo "Release de Windows/Linux não foi publicada; APK permanece acessível nos artefatos da Action." >&2
            exit 1
          fi
          apk="$(find android-preview -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          if [[ "$(basename "$apk")" != "AURORA-LIVES-Android-arm64.apk" ]]; then
            echo "Recusando publicar APK DEBUG como atualização." >&2
            exit 1
          fi
          # AURORA IPTV-style identity pinning: refuse any certificate
          # change once the first permanently signed APK has been published.
          current_cert="$(tr -d '\r\n' < android-preview/ANDROID-CERT-SHA256.txt)"
          for previous_tag in $(gh release list --limit 60 --json tagName --jq '.[].tagName'); do
            [[ "$previous_tag" == "$TAG" ]] && continue
            if gh release view "$previous_tag" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq 'ANDROID-CERT-SHA256.txt'; then
              mkdir -p prior-signer
              gh release download "$previous_tag" --pattern 'ANDROID-CERT-SHA256.txt' --dir prior-signer
              old_cert="$(tr -d '\r\n' < prior-signer/ANDROID-CERT-SHA256.txt)"
              if [[ "$current_cert" != "$old_cert" ]]; then
                echo 'ERRO: assinatura Android diferente da release assinada anterior!' >&2
                exit 1
              fi
              break
            fi
          done
          # Only signed APKs from the configured persistent certificate are published.
          gh release upload "$TAG" --clobber "$apk" \
            android-preview/SHA256SUMS-ANDROID.txt \
            android-preview/ANDROID-CERT-SHA256.txt \
            android-preview/aurora-lives-update.json
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx 'AURORA-LIVES-Android-arm64.apk'
          echo 'APK release com certificado persistente publicado.' >> "$GITHUB_STEP_SUMMARY"
