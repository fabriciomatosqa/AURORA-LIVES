name: AURORA LIVES - Instaladores

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installers:
    name: Instalador ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            bundle: inno
            artifact_path: apps/desktop/installer-win/*.exe
          - os: ubuntu-22.04
            platform: linux
            bundle: deb
            artifact_path: apps/desktop/src-tauri/target/release/bundle/deb/*.deb
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependências nativas Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - name: Dependências JavaScript
        run: npm install --no-audit --no-fund
      - name: Compilar Linux (.deb)
        if: runner.os == 'Linux'
        run: npm run package:desktop -- --bundles deb
      - name: Preparar Inno Setup (como no AURORA AutoFill)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 não encontrado." }
      - name: Compilar executável Tauri Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm run icons
          if ($LASTEXITCODE -ne 0) { throw "Falha ao gerar ícones." }
          npm run tauri -- build --no-bundle
          if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar o aplicativo Windows." }
      - name: Criar instalador Inno Setup por usuário
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:AURORA_VERSION = (node -p "require('./package.json').version").Trim()
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "packaging/windows/AURORA-LIVES.iss"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar instalador Inno Setup." }
          if (-not (Test-Path "installer-win/AURORA-LIVES-Windows-x64-Setup.exe")) {
            throw "Instalador Windows não foi gerado."
          }
      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: aurora-installer-${{ matrix.platform }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 30

  preview_release:
    name: Publicar pre-release de instaladores
    needs: [installers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: aurora-installer-*
          path: dist-installers
          merge-multiple: true
      - name: Identificar versão do aplicativo
        id: release_version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION-preview" >> "$GITHUB_ENV"
          if [[ "$VERSION" == "0.0.32" || "$VERSION" == "0.0.33" ]]; then
            echo "retired=true" >> "$GITHUB_OUTPUT"
            echo "::notice::A versão $VERSION foi retirada de distribuição; sem publicação de instaladores."
          fi
      - name: Padronizar nomes e checksums
        if: steps.release_version.outputs.retired != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          win="$(find dist-installers -type f -name '*.exe' -print -quit)"
          linux="$(find dist-installers -type f -name '*.deb' -print -quit)"
          test -n "$win"
          test -n "$linux"
          cp "$win" release/AURORA-LIVES-Windows-x64-Setup.exe
          cp "$linux" release/AURORA-LIVES-Linux-amd64.deb
          (cd release && sha256sum *.exe *.deb > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Publicar a versão prévia
        if: steps.release_version.outputs.retired != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A prévia $TAG já existe; evitando alterar instaladores publicados."
            exit 0
          fi
          # Publish as draft only after both installers have passed the build.
          # Release becomes visible only when all three assets are attached.
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "AURORA LIVES $VERSION — Atualização via GitHub" \
            --notes "Instaladores Windows Inno Setup e Linux DEB. Atualização diretamente pelo AURORA LIVES, sem Microsoft Store. Os arquivos são verificados com SHA-256. Os instaladores Windows continuam sem assinatura digital e podem ser bloqueados pelo Smart App Control." \
            --draft --prerelease --latest=false \
            release/AURORA-LIVES-Windows-x64-Setup.exe \
            release/AURORA-LIVES-Linux-amd64.deb \
            release/SHA256SUMS.txt
          test "$(gh release view "$TAG" --json assets --jq '.assets | length')" -eq 3
          gh release edit "$TAG" --draft=false --prerelease --latest=false
