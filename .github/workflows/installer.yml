name: AURORA LIVES - Instaladores

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installers:
    name: Instalador ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            bundle: nsis
            artifact_path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            platform: linux
            bundle: deb
            artifact_path: apps/desktop/src-tauri/target/release/bundle/deb/*.deb
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependências nativas Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - name: Dependências JavaScript
        run: npm install --no-audit --no-fund
      # Windows releases MUST have a trusted Authenticode certificate.
      # Never silently fall back to unsigned builds.
      - name: Exigir certificado confiável para assinatura Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AURORA_CODESIGN_PFX_BASE64: ${{ secrets.AURORA_CODESIGN_PFX_BASE64 }}
          AURORA_CODESIGN_PFX_PASSWORD: ${{ secrets.AURORA_CODESIGN_PFX_PASSWORD }}
        run: ./scripts/prepare-windows-signing.ps1
      - name: Compilar Linux (.deb)
        if: runner.os == 'Linux'
        run: npm run package:desktop -- --bundles deb
      - name: Compilar Windows assinado (.exe)
        if: runner.os == 'Windows'
        run: npm run package:desktop -- --bundles nsis --config src-tauri/tauri.signing.generated.json
      - name: Validar assinatura Authenticode do aplicativo e instalador
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-signing.ps1
      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: aurora-installer-${{ matrix.platform }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 30

  preview_release:
    name: Publicar pre-release de instaladores
    needs: [installers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: aurora-installer-*
          path: dist-installers
          merge-multiple: true
      - name: Identificar versão do aplicativo
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION-preview" >> "$GITHUB_ENV"
      - name: Padronizar nomes e checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          win="$(find dist-installers -type f -name '*.exe' -print -quit)"
          linux="$(find dist-installers -type f -name '*.deb' -print -quit)"
          test -n "$win"
          test -n "$linux"
          cp "$win" release/AURORA-LIVES-Windows-x64-Setup.exe
          cp "$linux" release/AURORA-LIVES-Linux-amd64.deb
          (cd release && sha256sum *.exe *.deb > SHA256SUMS.txt)
      - name: Publicar a versão prévia
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A prévia $TAG já existe; evitando alterar instaladores publicados."
            exit 0
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "AURORA LIVES $VERSION — Prévia" \
            --generate-notes \
            --prerelease \
            release/AURORA-LIVES-Windows-x64-Setup.exe \
            release/AURORA-LIVES-Linux-amd64.deb \
            release/SHA256SUMS.txt
