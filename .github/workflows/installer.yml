name: AURORA LIVES - Instaladores

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installers:
    name: Instalador ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            bundle: nsis
            artifact_path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            platform: linux
            bundle: deb
            artifact_path: apps/desktop/src-tauri/target/release/bundle/deb/*.deb
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependências nativas Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - name: Dependências JavaScript
        run: npm install --no-audit --no-fund
      - name: Compilar aplicativo e empacotar servidor local
        run: npm run package:desktop -- --bundles ${{ matrix.bundle }}
      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: aurora-installer-${{ matrix.platform }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 30

  preview_release:
    name: Publicar pre-release de instaladores
    needs: [installers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: aurora-installer-*
          path: dist-installers
          merge-multiple: true
      - name: Padronizar nomes e checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          win="$(find dist-installers -type f -name '*.exe' -print -quit)"
          linux="$(find dist-installers -type f -name '*.deb' -print -quit)"
          test -n "$win"
          test -n "$linux"
          cp "$win" release/AURORA-LIVES-Windows-x64-Setup.exe
          cp "$linux" release/AURORA-LIVES-Linux-amd64.deb
          (cd release && sha256sum *.exe *.deb > SHA256SUMS.txt)
      - name: Publicar a versão prévia
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.0.1-preview >/dev/null 2>&1; then
            echo "A prévia já existe; evitando alterar instaladores publicados."
            exit 0
          fi
          gh release create v0.0.1-preview \
            --target "$GITHUB_SHA" \
            --title "AURORA LIVES 0.0.1 — Prévia local" \
            --notes "Prévia técnica de chat local. Todos instalam o mesmo aplicativo, com a API local integrada. Esta versão **não permite comunicação entre computadores diferentes**, nem transmissão de voz/vídeo/tela; esses recursos dependem da futura infraestrutura compartilhada. Pacotes ainda não assinados." \
            --prerelease \
            release/AURORA-LIVES-Windows-x64-Setup.exe \
            release/AURORA-LIVES-Linux-amd64.deb \
            release/SHA256SUMS.txt
