name: AURORA LIVES CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    name: Go API - test and vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache: false
      - name: Unit tests and race detector
        run: go test -race -count=1 ./...
      - name: Static analysis
        run: go vet ./...
  frontend:
    name: Frontend build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test room protocol
        run: npm run test
      - name: Typecheck and build
        run: npm run build

  tauri:
    name: Tauri desktop compile
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Generate icons from original Aurora emblem
        run: npm run icons
      - name: Validate Tauri native crate
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Test updater native logic
        run: cargo test --manifest-path src-tauri/Cargo.toml

  visual-smoke:
    name: Frontend visual smoke · Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirmar navegador disponível
        run: command -v google-chrome || command -v chromium
      - name: Instalar dependências JavaScript
        run: npm install --no-audit --no-fund
      - name: Inspecionar interface em várias resoluções
        run: npm run test:visual
      - name: Guardar capturas para revisão visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-ui-screenshots
          path: apps/desktop/artifacts/ui/*.png
          if-no-files-found: warn
          retention-days: 14

  windows-inno-smoke:
    name: Windows · validar instalador Inno Setup
    runs-on: windows-latest
    timeout-minutes: 80
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Instalar dependências JavaScript
        run: npm install --no-audit --no-fund
      - name: Compilar binário Tauri
        shell: pwsh
        run: |
          npm run icons
          if ($LASTEXITCODE -ne 0) { throw "Falha ao gerar ícones Aurora." }
          npm run tauri -- build --no-bundle
          if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar o aplicativo." }
      - name: Validar sintaxe e bloqueio de assinatura ausente
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/sign-windows-artifact.ps1"),
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw "PowerShell de assinatura com sintaxe inválida: $($errors -join '; ')" }
          $env:WINDOWS_CODESIGN_PFX_BASE64 = ""
          $env:WINDOWS_CODESIGN_PFX_PASSWORD = ""
          try {
            ./scripts/sign-windows-artifact.ps1 -FilePath "src-tauri/target/release/aurora-lives.exe"
            throw "REGRESSÃO: release sem certificado seria assinada!"
          } catch {
            if ($_.Exception.Message -notmatch "Publicação Windows bloqueada") { throw }
            Write-Host "OK: nenhum release Windows sem assinatura confiável."
          }

      - name: Compilar instalador Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 indisponível." }
          $env:AURORA_VERSION = (node -p "require('./package.json').version").Trim()
          & $iscc "packaging/windows/AURORA-LIVES.iss"
          if ($LASTEXITCODE -ne 0) { throw "Falha na criação do instalador." }
          $setup = "installer-win/AURORA-LIVES-Windows-x64-Setup.exe"
          if (-not (Test-Path $setup)) { throw "O instalador não foi encontrado." }
          $bytes = (Get-Item $setup).Length
          if ($bytes -lt 100000) { throw "Instalador inesperadamente pequeno." }
          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash
          Write-Host "Inno Setup OK: $bytes bytes, SHA256 $hash"
      - name: Guardar instalador somente para teste do PR
        uses: actions/upload-artifact@v4
        with:
          name: aurora-inno-smoke-installer
          path: apps/desktop/installer-win/*.exe
          if-no-files-found: error
          retention-days: 3
