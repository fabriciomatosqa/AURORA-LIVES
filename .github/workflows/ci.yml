name: AURORA LIVES CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    name: Go API - test and vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache: false
      - name: Unit tests and race detector
        run: go test -race -count=1 ./...
      - name: Static analysis
        run: go vet ./...
  frontend:
    name: Frontend build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test room protocol
        run: npm run test
      - name: Typecheck and build
        run: npm run build

  tauri:
    name: Tauri desktop compile
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Validate release signing fails closed without certificate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:AURORA_CODESIGN_PFX_BASE64 = ""
          $env:AURORA_CODESIGN_PFX_PASSWORD = ""
          & pwsh -NoProfile -NonInteractive -File scripts/prepare-windows-signing.ps1 *> $null
          if ($LASTEXITCODE -eq 0) { throw "O pipeline permitiu preparar assinatura sem certificado." }
          if (Test-Path src-tauri/tauri.signing.generated.json) { throw "Configuração de assinatura criada sem certificado." }
          $env:AURORA_CODESIGN_THUMBPRINT = ""
          & pwsh -NoProfile -NonInteractive -File scripts/verify-windows-signing.ps1 *> $null
          if ($LASTEXITCODE -eq 0) { throw "O pipeline aceitou assinatura sem verificação." }
          Write-Host "A geração de release falha corretamente na ausência de certificado."
      - name: Generate icons from original Aurora emblem
        run: npm run icons
      - name: Validate Tauri native crate
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Test updater native logic
        run: cargo test --manifest-path src-tauri/Cargo.toml

  visual-smoke:
    name: Frontend visual smoke · Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirmar navegador disponível
        run: command -v google-chrome || command -v chromium
      - name: Instalar dependências JavaScript
        run: npm install --no-audit --no-fund
      - name: Inspecionar interface em várias resoluções
        run: npm run test:visual
      - name: Guardar capturas para revisão visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-ui-screenshots
          path: apps/desktop/artifacts/ui/*.png
          if-no-files-found: warn
          retention-days: 14
